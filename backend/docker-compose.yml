name: bumbercatch

services:
  postgres:
    image: postgres:16-alpine
    container_name: bumbercatch-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bumbercatch}
      POSTGRES_USER: ${POSTGRES_USER:-bumbercatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bumbercatch_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bumbercatch} -d ${POSTGRES_DB:-bumbercatch}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
